<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/product.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="product-detail">
      <h3>Cedar Ridge</h3>
      <h2 class="divider">Rimrock Tent - 2-Person, 3-Season</h2>
      <img class="divider"
        src="../images/tents/cedar-ridge-rimrock-tent-2-person-3-season-in-rust-clay~p~344yj_01~320.jpg"
        alt="Rimrock Tent - 2-Person, 3-Season" />
      <p class="product-card__price">$69.99</p>
      <p class="product__color">Rust/Clay</p>
      <p class="product__description">
        Lightweight and ready for adventure, this Cedar Ridge Rimrock tent
        boasts a weather-ready design that includes a tub-style floor and
        factory-sealed rain fly
      </p>
      <div class="product-detail__add">
        <button id="addToCart" data-id="344YJ">Add to Cart</button>
      </div>
    </section>

    <section class="product-reviews">
      <h2>Customer Reviews</h2>

      <div class="rating-summary">
        <div class="average-stars" id="averageStars"></div>
        <span id="averageRatingText">0.0 out of 5 stars</span>
      </div>

      <div id="reviewsContainer" class="reviews-container">
      </div>

      <form id="reviewForm" class="review-form">
        <h3>Write a Review</h3>

        <label for="reviewerName">Name</label>
        <input type="text" id="reviewerName" required placeholder="Your name...">

        <label>Your Rating</label>
        <div class="star-rating-input">
          <input type="radio" id="star5" name="rating" value="5" required><label for="star5" title="5 stars">★</label>
          <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars">★</label>
          <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars">★</label>
          <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars">★</label>
          <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star">★</label>
        </div>

        <label for="reviewText">Review</label>
        <textarea id="reviewText" rows="4" required
          placeholder="What did you like or dislike about this gear?"></textarea>

        <button type="submit" id="submitReviewBtn">Submit Review</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
