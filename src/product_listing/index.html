<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Products</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product-listing.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <h2>Top Products: <span class="title highlight"></span></h2>

        <div
          class="sort-container"
          style="
            margin: 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
          "
        >
          <label for="sort-select" style="font-weight: bold">Sort By: </label>
          <select
            id="sort-select"
            style="
              padding: 0.4rem;
              border-radius: 4px;
              border: 1px solid #ccc;
              font-size: 1rem;
            "
          >
            <option value="">Default</option>
            <option value="name">Name (A-Z)</option>
            <option value="price">Price (Low to High)</option>
          </select>
        </div>

        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
