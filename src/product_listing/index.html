<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Products</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Top Products: <span class="title highlight"></span></h2>

      <!-- Product Sorting Dropdown -->
      <div class="sort-container" style="margin: 10px 0;">
        <label for="sort-select">Sort by: </label>
        <select id="sort-select">
          <option value="">Select sorting...</option>
          <option value="name">Name (A-Z)</option>
          <option value="price">Price (Low to High)</option>
        </select>
      </div>

      <ul class="product-list"></ul>
    </section>
  </main>

  <footer id="main-footer"></footer>
  <script type="module" src="../js/product-listing.js"></script>
</body>

</html>
